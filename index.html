const getDriveUrl = (id) => 'https://lh3.googleusercontent.com/d/' + id;
const getDownloadUrl = (id) => 'https://drive.google.com/uc?export=download&id=' + id;

let currentTab = 'CAM 01 - IPHONE';
let currentIndex = 0;
let isZoomed = false;
let likedPhotos = new Set(JSON.parse(localStorage.getItem('album_likes') || '[]'));
let isSelectionMode = false;
let selectedPhotos = new Set();

function showToast(msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'bg-black text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl transition-all duration-300 transform translate-y-4 opacity-0 flex items-center gap-2 dark:bg-white dark:text-black';
    toast.innerHTML = `<i data-lucide="info" class="w-4 h-4"></i> ${msg}`;
    container.appendChild(toast);
    lucide.createIcons();
    
    // Trigger reflow
    void toast.offsetWidth;
    toast.classList.remove('translate-y-4', 'opacity-0');
    
    setTimeout(() => {
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function customAlert(msg) {
    document.getElementById('custom-alert-msg').textContent = msg;
    document.getElementById('custom-alert').classList.remove('hidden');
    document.getElementById('custom-alert').classList.add('flex');
}

function closeCustomAlert() {
    document.getElementById('custom-alert').classList.add('hidden');
    document.getElementById('custom-alert').classList.remove('flex');
}

let confirmCallback = null;
function customConfirm(msg, callback) {
    confirmCallback = callback;
    document.getElementById('custom-confirm-msg').textContent = msg;
    document.getElementById('custom-confirm').classList.remove('hidden');
    document.getElementById('custom-confirm').classList.add('flex');
}

function closeCustomConfirm(result) {
    document.getElementById('custom-confirm').classList.add('hidden');
    document.getElementById('custom-confirm').classList.remove('flex');
    if (result && confirmCallback) confirmCallback();
    confirmCallback = null;
}

function getTabData(tab) {
  const cam = GALLERY_DATA.find(c => c.label === tab);
  return cam ? cam.photos : [];
}

function init() {
  updateLikeCount();
  renderGallery();
  lucide.createIcons();
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('download-menu');
    if (!e.target.closest('.download-trigger') && menu && !menu.classList.contains('hidden') && !menu.contains(e.target)) {
      menu.classList.add('hidden');
      menu.classList.remove('flex');
    }
  });
  document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('hidden')) {
      if (e.key === 'ArrowLeft') changePhoto(-1);
      if (e.key === 'ArrowRight') changePhoto(1);
      if (e.key === 'Escape') closeLightbox();
    }
  });
}

function renderGallery() {
  const grid = document.getElementById('photo-grid');
  const images = getTabData(currentTab);
  if (!images || images.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:5rem;text-align:center;color:#d1d5db;font-size:0.75rem;letter-spacing:0.2em;">NO PHOTOS IN THIS TAB YET</div>';
    return;
  }
  if (isSelectionMode) {
    grid.innerHTML = images.map((img, idx) => `
      <div class="gallery-item cursor-pointer overflow-hidden group relative" onclick="toggleSelection('${img.id}')">
        <img src="${getDriveUrl(img.id)}" class="w-full h-auto object-cover ${selectedPhotos.has(img.id)?'opacity-80':''}" onerror="this.src='https://placehold.co/400x500/eee/999?text=Loading'">
        <div class="absolute inset-0 bg-black/10 ${selectedPhotos.has(img.id)?'opacity-100':'opacity-0'}"></div>
        <div class="absolute top-3 right-3 z-20">
          <div class="checkbox-ring ${selectedPhotos.has(img.id)?'selected':''}">
            ${selectedPhotos.has(img.id)?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>':''}
          </div>
        </div>
      </div>
    `).join('');
  } else {
    grid.innerHTML = images.map((img, idx) => `
      <div class="gallery-item cursor-pointer overflow-hidden group relative" onclick="openLightbox(${idx})">
        <img src="${getDriveUrl(img.id)}" class="w-full h-auto object-cover transition-opacity duration-500 group-hover:opacity-90" loading="lazy" onerror="this.src='https://placehold.co/400x500/eee/999?text=Loading'">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
        <div class="absolute bottom-4 right-4 flex items-center gap-4 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-y-2 group-hover:translate-y-0 z-10">
          <button onclick="event.stopPropagation();shareImageDirect('${img.id}')" class="text-white"><i data-lucide="share" class="w-5 h-5"></i></button>
          <button onclick="event.stopPropagation();downloadImage('${img.id}', '${img.name.replace(/'/g, "\\'")}')" class="text-white"><i data-lucide="download" class="w-5 h-5"></i></button>
          <button onclick="event.stopPropagation();toggleLike('${img.id}')" class="text-white hover:text-red-500"><i data-lucide="heart" class="w-5 h-5 ${likedPhotos.has(img.id)?'liked':''}"></i></button>
        </div>
      </div>
    `).join('');
  }
  lucide.createIcons();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active','text-zinc-900'); b.classList.add('text-zinc-400'); });
  if(tab==='CAM 01 - IPHONE'){document.getElementById('tab-0').classList.add('tab-active','text-zinc-900');document.getElementById('tab-0').classList.remove('text-zinc-400');}
  if(tab==='CAM 02 S24'){document.getElementById('tab-1').classList.add('tab-active','text-zinc-900');document.getElementById('tab-1').classList.remove('text-zinc-400');}
  
  const idx = GALLERY_DATA.findIndex(c => c.label === tab);
  if (idx >= 0) document.getElementById('tab-'+idx)?.classList.add('tab-active','text-zinc-900');
  document.getElementById('current-tab-name').textContent = tab;
  renderGallery();
}

function openLightbox(index) {
  if (isSelectionMode) return;
  currentIndex = index;
  const images = getTabData(currentTab);
  document.getElementById('lb-img').src = getDriveUrl(images[index].id);
  document.getElementById('lb-counter').textContent = (index+1) + ' / ' + images.length;
  document.getElementById('lightbox').classList.remove('hidden');
  document.getElementById('lightbox').classList.add('flex');
  document.body.style.overflow = 'hidden';
  updateLightboxHeart();
  lucide.createIcons();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  document.getElementById('lightbox').classList.remove('flex');
  document.body.style.overflow = '';
  isZoomed = false;
  document.getElementById('lb-img').classList.remove('zoom-active');
}

function changePhoto(dir) {
  const images = getTabData(currentTab);
  currentIndex = (currentIndex + dir + images.length) % images.length;
  openLightbox(currentIndex);
}

function toggleZoom() {
  isZoomed = !isZoomed;
  document.getElementById('lb-img').classList.toggle('zoom-active', isZoomed);
}

function toggleLike(id) {
  if (likedPhotos.has(id)) likedPhotos.delete(id); else likedPhotos.add(id);
  localStorage.setItem('album_likes', JSON.stringify(Array.from(likedPhotos)));
  updateLikeCount(); renderGallery(); updateLightboxHeart();
}

function toggleLikeCurrent() {
  const images = getTabData(currentTab);
  toggleLike(images[currentIndex].id);
}

function updateLikeCount() {
  document.getElementById('like-count').textContent = likedPhotos.size;
}

function updateLightboxHeart() {
  const images = getTabData(currentTab);
  if (!images[currentIndex]) return;
  const heartIcon = document.getElementById('lb-heart-btn').querySelector('svg');
  if (heartIcon) {
    if (likedPhotos.has(images[currentIndex].id)) heartIcon.classList.add('liked');
    else heartIcon.classList.remove('liked');
  }
}

function downloadImage(id, filename) {
  const url = getDownloadUrl(id);
  const safeFilename = (filename || 'Photo').replace(/[^a-z0-9\s-]/gi, '_') + '.jpg';
  
  showToast('Downloading ' + safeFilename + '...');
  
  // Try fetching the image blob directly to force standard file download on mobile
  fetch(getDriveUrl(id))
    .then(res => {
      if (!res.ok) throw new Error('Network error');
      return res.blob();
    })
    .then(blob => {
      const blobUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = blobUrl;
      a.download = safeFilename; // Forces the .jpg extension
      document.body.appendChild(a);
      a.click();
      
      // Clean up memory
      setTimeout(() => {
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      }, 1000);
    })
    .catch(err => {
      console.warn('Direct fetch failed, falling back to Drive link:', err);
      // Fallback approach if CORS blocked
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.target = '_blank';
      a.download = safeFilename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
}

function downloadCurrent() {
  const images = getTabData(currentTab);
  const img = images[currentIndex];
  downloadImage(img.id, img.name);
}

function toggleDownloadMenu() {
  const menu = document.getElementById('download-menu');
  menu.classList.toggle('hidden');
  menu.classList.toggle('flex');
}

function startSelectionMode() {
  isSelectionMode = true; selectedPhotos.clear();
  document.getElementById('download-menu').classList.add('hidden');
  document.getElementById('download-menu').classList.remove('flex');
  document.getElementById('chat-bubble').classList.add('hidden');
  document.getElementById('selection-bar').classList.remove('translate-y-full');
  document.getElementById('selection-instructions').classList.remove('hidden');
  renderGallery();
}

function cancelSelectionMode() {
  isSelectionMode = false; selectedPhotos.clear();
  document.getElementById('selection-bar').classList.add('translate-y-full');
  document.getElementById('selection-instructions').classList.add('hidden');
  document.getElementById('chat-bubble').classList.remove('hidden');
  renderGallery();
}

function toggleSelection(id) {
  if (selectedPhotos.has(id)) selectedPhotos.delete(id); else selectedPhotos.add(id);
  document.getElementById('selected-count').textContent = selectedPhotos.size;
  renderGallery();
}

function selectAll() {
  getTabData(currentTab).forEach(img => selectedPhotos.add(img.id));
  document.getElementById('selected-count').textContent = selectedPhotos.size;
  renderGallery();
}

function downloadSelectedBatch() {
  if (selectedPhotos.size === 0) { 
    showToast('Select at least one photo.'); 
    return; 
  }
  batchDownload(Array.from(selectedPhotos));
}

function downloadAllInTab() {
  const images = getTabData(currentTab);
  if (!images.length) { 
    showToast('No photos in this tab.'); 
    return; 
  }
  
  customConfirm('Download all ' + images.length + ' images from ' + currentTab + '?', () => {
    batchDownload(images.map(img => img.id));
  });
  
  document.getElementById('download-menu').classList.add('hidden');
  document.getElementById('download-menu').classList.remove('flex');
}

function batchDownload(ids) {
  showToast('Starting download for ' + ids.length + ' images. Allow pop-ups if blocked.');
  let delay = 0;
  const allImages = GALLERY_DATA.flatMap(c => c.photos);
  
  ids.forEach(id => {
    const img = allImages.find(i => i.id === id);
    const name = img ? img.name : 'Photo';
    
    setTimeout(() => {
      downloadImage(id, name);
    }, delay);
    delay += 1000; // Staggered delay to prevent browser blockage
  });
  cancelSelectionMode();
}

function filterLikes() {
  if (likedPhotos.size === 0) { 
    customAlert("You haven't liked any photos yet!"); 
    return; 
  }
  const allImages = GALLERY_DATA.flatMap(c => c.photos);
  const faves = allImages.filter(img => likedPhotos.has(img.id));
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = faves.map((img, idx) => `
    <div class="gallery-item cursor-pointer overflow-hidden group">
      <img src="${getDriveUrl(img.id)}" class="w-full h-auto object-cover">
    </div>
  `).join('');
  document.getElementById('gallery-subtitle').textContent = 'MY FAVORITES';
  lucide.createIcons();
}

function exportFavoritesCSV() {
  if (likedPhotos.size === 0) { 
    showToast('Heart some photos first!'); 
    return; 
  }
  const allImages = GALLERY_DATA.flatMap(c => c.photos);
  const faves = allImages.filter(img => likedPhotos.has(img.id));
  const csv = 'Photo Name,Drive ID,Drive URL\n' + faves.map(img => 
    `${img.name},${img.id},https://drive.google.com/file/d/${img.id}/view`
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-favorites-MCA_2023__25.csv';
  a.click();
}

function closeShareModal(e) {

  document.getElementById('share-modal').classList.remove('flex');
}

function copyShareLink() {
  const val = document.getElementById('share-url-input').value;
  // Fallback for clipboard api within iframes
  const textArea = document.createElement("textarea");
  textArea.value = val;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    document.getElementById('copy-btn-text').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('copy-btn-text').textContent = 'Copy Link'; }, 2000);
  } catch (err) {
    console.error('Failed to copy', err);
  }
  document.body.removeChild(textArea);
}

function openContactModal() {
  const modal = document.getElementById('contact-modal');
  modal.classList.remove('hidden'); modal.classList.add('flex');
  lucide.createIcons();
}

function closeContactModal(e) {
  if (e && e.target !== document.getElementById('contact-modal')) return;
  document.getElementById('contact-modal').classList.add('hidden');
  document.getElementById('contact-modal').classList.remove('flex');

function toggleDarkMode() {
  document.body.classList.toggle('dark');
  document.documentElement.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('dark_mode', isDark);
  const icon = document.getElementById('dark-icon');
  if (icon) {
    icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
    lucide.createIcons();
  }
}

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === 'MCA') {
    document.getElementById('pw-gate').style.display = 'none';
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}

window.onload = function() {
  init();
  if (localStorage.getItem('dark_mode') === 'true') {
    document.body.classList.add('dark');
    document.documentElement.classList.add('dark');
    const icon = document.getElementById('dark-icon');
    if (icon) { icon.setAttribute('data-lucide','sun'); lucide.createIcons(); }
  }
};
